# Temporary: the second full quality audit (4 Oct, after the fixes went live) of https://debrief.to (Lighthouse, axe
# WCAG 2.2, end-to-end in three browser engines, HTML validation, security
# headers, links). Removed once the results are read.
name: QA audit

on:
  push:
    branches: [claude/gracious-albattani-7lpq3a]
    paths: [".qa/**", ".github/workflows/qa-audit.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .qa
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .qa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: End-to-end (and axe on chromium)
        run: ENGINE=${{ matrix.engine }} AXE=${{ matrix.engine == 'chromium' && '1' || '0' }} node e2e.mjs
      - name: Metadata and HTML validation
        if: matrix.engine == 'chromium'
        run: node meta.mjs
      - name: Links
        if: matrix.engine == 'chromium'
        run: node links.mjs

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .qa
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .qa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse (phone and desktop; analytics blocked so test visits aren't counted)
        run: |
          # The URL goes first: --blocked-url-patterns takes a list and would swallow it
          lh() { npx -y lighthouse@13.5.0 "$1" "${@:2}" --quiet --output=json --chrome-flags=--headless=new --blocked-url-patterns="*/_vercel/insights/*" || true; }
          for run in 1 2 3; do
            lh "https://debrief.to/" --output-path=lh-phone-first-visit-run$run.json
            lh "https://debrief.to/?town=newmarket" --output-path=lh-phone-feed-run$run.json
            lh "https://debrief.to/?town=newmarket" --preset=desktop --output-path=lh-desktop-feed-run$run.json
            lh "https://debrief.to/?view=about&town=newmarket" --output-path=lh-phone-about-run$run.json
            lh "https://debrief.to/?view=picks&town=newmarket" --output-path=lh-phone-picks-run$run.json
          done
      - run: node lh-summary.mjs lh-*.json

  http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .qa
      - run: sudo apt-get install -y -qq libxml2-utils >/dev/null 2>&1 || true
      - run: bash .qa/http.sh
