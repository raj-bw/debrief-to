# Temporary: find where five Postmedia papers moved. Removed after reading.
name: Probe Postmedia moves (temporary)
on:
  push:
    branches: [claude/gracious-albattani-7lpq3a]
    paths: [".probe/**", ".github/workflows/probe-postmedia.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
