# Keeps the archive filling, every three hours, whether or not anyone visits.
#
# The collector (/api/collect) visits every publication for every active town
# and stores what's new. Vercel runs it once a day on its own (vercel.json);
# the free plan allows no more than that. Busy newsrooms roll stories out of
# their feeds in less than a day, so this runs it every three hours as well.
# Either one alone keeps the archive whole; together they cover for each other.
#
# Setup, once:
#   1. In Vercel: Settings → Environment Variables → add CRON_SECRET (any long
#      random string). Vercel's own daily run sends it automatically.
#   2. In GitHub: Settings → Secrets and variables → Actions → New repository
#      secret → name CRON_SECRET, same value.
# Without the secret the collector still runs, but at most every 20 minutes.
#
# GitHub pauses scheduled workflows in a repository with no activity for 60
# days. The last step prevents that, using only GitHub's own API. If it ever
# pauses anyway, Vercel's daily run still keeps the archive going.

name: Keep the archive filling

on:
  schedule:
    - cron: "17 */3 * * *"   # every three hours, at 17 past (quieter than :00)
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab

permissions:
  actions: write              # only for the keepalive step

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the collector
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          auth=()
          if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
          code=$(curl -sS --max-time 320 -o out.json -w "%{http_code}" "${auth[@]}" "https://debrief.to/api/collect")
          head -c 3000 out.json; echo
          echo "collector answered HTTP $code"
          if [ "$code" = "401" ]; then echo "::error::CRON_SECRET in GitHub doesn't match the one in Vercel"; exit 1; fi
          if [ "$code" != "200" ]; then echo "::error::collector did not finish (HTTP $code)"; exit 1; fi

      # limit=1 checks one feed only, so this report doesn't knock on every
      # publisher at once (that burst is what trips Metroland's 429s).
      - name: Report the archive's state
        run: |
          curl -sS --max-time 60 "https://debrief.to/api/health?limit=1" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('archive'), indent=1))"

      # No outside action needed: re-enabling the workflow through GitHub's own
      # API resets the 60-day inactivity clock. (The popular keepalive action
      # this used to call is blocked by GitHub.) Never fails the run.
      - name: Stop GitHub pausing this schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/archive-ping.yml/enable" \
            && echo "schedule kept alive" || echo "keepalive skipped"
