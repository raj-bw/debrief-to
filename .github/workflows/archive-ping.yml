# Keeps the archive filling, every hour, whether or not anyone visits.
#
# The collector (/api/collect) visits every publication for every active town
# and stores what's new. Vercel runs it once a day on its own (vercel.json);
# the free plan allows no more than that. Busy newsrooms roll stories out of
# their feeds in less than a day, and readers now read only from the archive,
# so this runs it every hour: a new story reaches the site within the hour.
# Either one alone keeps the archive whole; together they cover for each other.
#
# Setup, once:
#   1. In Vercel: Settings → Environment Variables → add CRON_SECRET (any long
#      random string). Vercel's own daily run sends it automatically.
#   2. In GitHub: Settings → Secrets and variables → Actions → New repository
#      secret → name CRON_SECRET, same value.
# Without the secret the collector still runs, but at most every 20 minutes.
#
# After the collector, a second step asks the Metroland/Torstar papers that
# turned Vercel away ("too many requests") once more from GitHub's own
# network, and hands what it gets to the site (scripts/second-network.mjs).
#
# GitHub pauses scheduled workflows in a repository with no activity for 60
# days. The last step prevents that, using only GitHub's own API. If it ever
# pauses anyway, Vercel's daily run still keeps the archive going.

name: Keep the archive filling

on:
  schedule:
    - cron: "17 * * * *"      # every hour, at 17 past (quieter than :00)
  workflow_dispatch: {}       # "Run workflow" button, and the hourly cron-job.org timer

# One run at a time. The cron-job.org timer starts a run at :47 and
# GitHub's own schedule at :17 (often late); if they ever meet, the second
# waits for the first rather than both asking every newsroom at once.
concurrency:
  group: keep-the-archive-filling
  cancel-in-progress: false

permissions:
  actions: write              # only for the keepalive step
  contents: read              # to check out the second network's script

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only the second network's script is needed from the repository.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # In two parts, one after the other, each with the collector's full
      # four minutes: one run had stopped being enough for every publication
      # (see partOf in app/lib/collect-jobs.js). A part that fails doesn't
      # stop the other.
      - name: Run the collector, part 1 of 2
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/collect-part.sh 1 out1.json

      - name: Run the collector, part 2 of 2
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/collect-part.sh 2 out2.json

      # Never fails the run: a second chance, not the main road.
      - name: Ask refused Metroland/Torstar papers again, from GitHub's network
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node scripts/second-network.mjs out1.json || echo "second network skipped (part 1)"
          node scripts/second-network.mjs out2.json || echo "second network skipped (part 2)"

      # limit=0 asks no publisher at all, only the archive, so this report
      # neither knocks on every newsroom at once (the burst that trips
      # Metroland's 429s) nor waits its turn behind a full check.
      - name: Report the archive's state
        if: always()
        run: |
          curl -sS --max-time 60 "https://debrief.to/api/health?limit=0" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('archive'), indent=1))"

      # No outside action needed: re-enabling the workflow through GitHub's own
      # API resets the 60-day inactivity clock. (The popular keepalive action
      # this used to call is blocked by GitHub.) Never fails the run.
      - name: Stop GitHub pausing this schedule
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/archive-ping.yml/enable" \
            && echo "schedule kept alive" || echo "keepalive skipped"
